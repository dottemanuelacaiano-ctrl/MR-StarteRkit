<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Check-up IMPRESA 360</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap">
<style>
/* Layout: una colonna stretta, una area per schermata, risultato con radar e elenco per fase */
:root {
  --bg: #F6F7FB; --surface: #FFFFFF; --fg: #1E2761; --muted: #56658A; --line: #DCE2F1;
  --btn-bg: #1E2761; --btn-fg: #FFFFFF; --amber: #F2A93B; --amber-text: #8F5700; --amber-soft: #FDF0D5;
  --bar: #1E2761; --focus: #C98410;
  --good-fg: #14663F; --good-bg: #DDF3E7; --mid-fg: #8A5200; --mid-bg: #FDEBC8; --low-fg: #A12E22; --low-bg: #FBE0DC;
  --font-display: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --font-body: 'Source Sans 3', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1230; --surface: #161C45; --fg: #E8ECFA; --muted: #A2ADD2; --line: #2A3468;
    --btn-bg: #F2A93B; --btn-fg: #14194A; --amber-text: #F5BC63; --amber-soft: #352B14;
    --bar: #F2A93B; --focus: #F5BC63;
    --good-fg: #86D9AA; --good-bg: #143A2B; --mid-fg: #F5C26B; --mid-bg: #3A2D10; --low-fg: #F5A89E; --low-bg: #42201A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1230; --surface: #161C45; --fg: #E8ECFA; --muted: #A2ADD2; --line: #2A3468;
  --btn-bg: #F2A93B; --btn-fg: #14194A; --amber-text: #F5BC63; --amber-soft: #352B14;
  --bar: #F2A93B; --focus: #F5BC63;
  --good-fg: #86D9AA; --good-bg: #143A2B; --mid-fg: #F5C26B; --mid-bg: #3A2D10; --low-fg: #F5A89E; --low-bg: #42201A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.55;
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 680px; margin-inline: auto; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber-text); }
.step-count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 4px; background: var(--line); border-radius: 2px; margin-block: 10px 28px; overflow: hidden; }
.progress > div { height: 100%; background: var(--amber); width: 0; transition: width 0.25s ease; }
@media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }

h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 5.4vw, 2.2rem); line-height: 1.18; margin: 0 0 10px; text-wrap: balance; }
h1:focus { outline: none; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 1.3rem; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; }
.kicker { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.lead { font-size: 17px; color: var(--muted); margin: 0 0 20px; max-width: 60ch; }
.legend { font-size: 14px; color: var(--muted); margin: 0 0 4px; }

/* domande */
fieldset { border: 0; border-top: 1px solid var(--line); margin: 0; padding: 18px 0 20px; min-width: 0; }
legend { font-size: 17px; font-weight: 600; line-height: 1.4; padding: 0; margin-bottom: 12px; float: left; width: 100%; }
fieldset .scale { clear: both; }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.scale input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.scale label {
  display: flex; align-items: center; justify-content: center; min-height: 48px;
  border: 1.5px solid var(--line); border-radius: 10px; background: var(--surface);
  font-weight: 700; font-size: 17px; cursor: pointer; font-variant-numeric: tabular-nums;
}
.scale label:hover { border-color: var(--fg); }
.scale input:checked + label { background: var(--btn-bg); color: var(--btn-fg); border-color: var(--btn-bg); }
.scale input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }

/* campi */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.field label { font-weight: 600; font-size: 15px; }
.field .opt { font-weight: 400; color: var(--muted); }
input[type="text"], select, textarea {
  font: inherit; font-size: 16px; color: var(--fg); background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; min-width: 0;
}
textarea { min-height: 92px; resize: vertical; }
input[type="text"]:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }

/* pulsanti */
.nav { display: flex; gap: 12px; justify-content: space-between; margin-top: 8px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 700; font-size: 16px; min-height: 48px; padding: 0 24px;
  border-radius: 10px; border: 1.5px solid var(--btn-bg); background: var(--btn-bg); color: var(--btn-fg); cursor: pointer;
}
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.ghost:hover:not(:disabled) { border-color: var(--fg); }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.hint { font-size: 14px; color: var(--muted); margin: 12px 0 0; min-height: 1.4em; }

/* risultato */
.score { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-block: 8px 4px; }
.score .num { font-family: var(--font-display); font-weight: 700; font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pill { display: inline-block; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.good { color: var(--good-fg); background: var(--good-bg); }
.pill.mid { color: var(--mid-fg); background: var(--mid-bg); }
.pill.low { color: var(--low-fg); background: var(--low-bg); }
.radar { max-width: 420px; margin-inline: auto; }
.radar svg { width: 100%; height: auto; display: block; }
.rg { fill: none; stroke: var(--line); stroke-width: 1; }
.rax { stroke: var(--line); stroke-width: 1; fill: none; }
.rpoly { fill: var(--amber); fill-opacity: 0.28; stroke: var(--amber); stroke-width: 2.5; stroke-linejoin: round; }
.rdot { fill: var(--amber); stroke: var(--surface); stroke-width: 1.5; }
.rlab { fill: var(--muted); font-size: 13px; font-weight: 600; font-family: var(--font-body); }
.caption { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 0 24px; }

.phase-head { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 26px 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.arow { padding-block: 12px; border-bottom: 1px solid var(--line); }
.arow .l1 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.arow .nm { font-weight: 600; }
.arow .ss { font-size: 13px; color: var(--muted); }
.arow .r { display: flex; align-items: center; gap: 10px; flex: none; }
.arow .pc { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.track { height: 6px; background: var(--line); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.track > div { height: 100%; background: var(--bar); border-radius: 3px; }

.start { margin-top: 28px; padding: 18px 20px; background: var(--amber-soft); border-radius: 12px; }
.start ul { margin: 8px 0 10px; padding-left: 20px; }
.start li { margin-bottom: 6px; }
.start p { margin: 0; }

.send { margin-top: 28px; }
.send textarea { min-height: 280px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; line-height: 1.5; }
.send .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
.status { font-size: 14px; color: var(--muted); }
.reset { margin-top: 28px; }
.foot { margin-top: 44px; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Check-up IMPRESA 360</div>
    <div class="step-count" id="stepcount"></div>
  </header>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  <main id="app"></main>
  <footer class="foot">Emanuela Caiano · Executive Coach · MR Corporate</footer>
</div>

<script>
(function () {
  var PHASES = [
    { name: 'Visione e Modello' },
    { name: 'Struttura e Organizzazione' },
    { name: 'Mercato e Controllo' },
    { name: 'Esecuzione e Crescita' }
  ];

  var AREAS = [
    { short: 'Visione', name: 'Visione e problema', fase: 1, sess: 'Sessione 1', doc: 'Business Vision Canvas',
      lead: 'Il problema che risolvi e dove vuoi portare l’attività.',
      items: ['So spiegare in una frase quale problema risolve la mia attività e per chi.',
              'Ho una visione a tre anni scritta, non solo in testa.',
              'Le mie scelte quotidiane seguono priorità chiare, legate a questa visione.'] },
    { short: 'Cliente', name: 'Cliente e proposta di valore', fase: 1, sess: 'Sessione 2', doc: 'Mappa del cliente e proposta di valore',
      lead: 'Chi serve la tua attività e perché ti sceglie.',
      items: ['Ho definito con precisione il mio cliente ideale: chi è, cosa cerca, quanto può spendere.',
              'Negli ultimi sei mesi ho parlato con almeno dieci potenziali clienti per capire i loro bisogni.',
              'So spiegare perché un cliente dovrebbe scegliere me e non un’alternativa.'] },
    { short: 'Modello', name: 'Modello di business e ricavi', fase: 1, sess: 'Sessione 3', doc: 'Business Model Canvas e ipotesi di pricing',
      lead: 'Come l’attività guadagna e quanto margine lascia.',
      items: ['So quali sono le fonti di ricavo della mia attività e quanto pesa ciascuna.',
              'Ho definito i prezzi in base a costi e valore percepito, non a sensazione.',
              'So qual è il margine di ogni mia offerta o servizio.'] },
    { short: 'Ruoli', name: 'Organizzazione e ruoli', fase: 2, sess: 'Sessione 4', doc: 'Organigramma v1 e mansionario',
      lead: 'Chi fa cosa, oggi e nei prossimi dodici mesi.',
      items: ['Ho un organigramma, anche essenziale, con ruoli e responsabilità scritti, anche se oggi li ricopro quasi tutti io.',
              'So quali ruoli dovrò inserire nei prossimi dodici mesi e in quale ordine.',
              'Collaboratori e fornitori sanno con chiarezza cosa mi aspetto da loro.'] },
    { short: 'Processi', name: 'Processi e deleghe', fase: 2, sess: 'Sessioni 5-6', doc: 'Mappa dei processi core e matrice delle responsabilità',
      lead: 'Quanto l’attività funziona senza dipendere da te in ogni passaggio.',
      items: ['Le attività che si ripetono (offerta, avvio del cliente, fatturazione) seguono un metodo scritto.',
              'Potrei assentarmi per due settimane senza che l’attività si fermi.',
              'So cosa posso delegare e cosa devo continuare a fare io.'] },
    { short: 'Mercato', name: 'Mercato e acquisizione clienti', fase: 3, sess: 'Sessione 7', doc: 'Piano commerciale a 90 giorni',
      lead: 'Come arrivi ai clienti in modo regolare.',
      items: ['Ho scelto due o tre canali precisi per acquisire clienti e li presidio con regolarità.',
              'So quanti contatti e quante trattative ho in corso ogni mese.',
              'Ho un messaggio commerciale chiaro e materiali (sito, profilo, presentazione) coerenti con esso.'] },
    { short: 'Numeri', name: 'Numeri e cruscotto', fase: 3, sess: 'Sessioni 8-9', doc: 'Cruscotto KPI e piano economico-finanziario',
      lead: 'Quanto vedi con chiarezza l’andamento dell’attività.',
      items: ['Ogni mese misuro un piccolo set di indicatori (KPI) sulla mia attività.',
              'Ho un budget e so di quanta cassa dispongo nei prossimi sei mesi.',
              'Decido guardando i numeri, non solo seguendo l’intuizione.'] },
    { short: 'Piano', name: 'Piano d’azione e leadership', fase: 4, sess: 'Sessioni 10-12', doc: 'Roadmap a 90 giorni, piano del team e dossier finale',
      lead: 'Priorità, tempo ed energie di chi guida l’attività.',
      items: ['Ho un piano d’azione a 90 giorni con priorità e scadenze.',
              'Ogni settimana dedico tempo a lavorare sull’attività, non solo nell’attività.',
              'So come gestire carico di lavoro, stress e decisioni difficili da fondatore o professionista.'] }
  ];

  var TIPI = ['Startup', 'Consulente o professionista indipendente', 'Altro progetto imprenditoriale'];
  var FASI = ['Ho un’idea, non ho ancora iniziato', 'Ho avviato da meno di 12 mesi', 'Sono in attività da più di 12 mesi'];
  var MAIL = 'Emanuela@mrcorporate.it';
  var SEND_URL = 'https://formsubmit.co/ajax/' + MAIL;
  var KEY = 'impresa360-checkup-v1';
  var LAST = AREAS.length + 1; // step delle domande aperte = 9, risultato = 10
  var RESULT = AREAS.length + 2;

  var S = { step: 0, profile: { nome: '', tipo: '', fase: '' }, a: {}, open: { idea: '', ostacolo: '', obiettivo: '' } };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      if (p && typeof p === 'object') {
        S.step = typeof p.step === 'number' ? p.step : 0;
        S.profile = Object.assign(S.profile, p.profile || {});
        S.a = p.a && typeof p.a === 'object' ? p.a : {};
        S.open = Object.assign(S.open, p.open || {});
        S.sent = !!p.sent;
      }
    }
  } catch (e) {}

  var app = document.getElementById('app');
  var bar = document.getElementById('bar');
  var stepcount = document.getElementById('stepcount');

  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  function profileOk() { return S.profile.nome.trim() && S.profile.tipo && S.profile.fase; }
  function areaDone(i) { return [0, 1, 2].every(function (k) { return S.a[i + '-' + k] >= 1; }); }
  function maxStep() {
    if (!profileOk()) return 0;
    for (var i = 0; i < AREAS.length; i++) if (!areaDone(i)) return i + 1;
    return RESULT;
  }
  function areaSum(i) { return [0, 1, 2].reduce(function (t, k) { return t + (S.a[i + '-' + k] || 0); }, 0); }
  function areaPct(i) { return Math.round((areaSum(i) - 3) / 12 * 100); }
  function level(p) {
    if (p >= 70) return { t: 'Solido', c: 'good' };
    if (p >= 40) return { t: 'In sviluppo', c: 'mid' };
    return { t: 'Da costruire', c: 'low' };
  }
  function overallLabel(p) {
    if (p >= 70) return 'Impresa già strutturata';
    if (p >= 40) return 'Struttura in sviluppo';
    return 'Impresa da costruire';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function go(n) {
    S.step = Math.max(0, Math.min(n, Math.min(maxStep() === RESULT ? RESULT : maxStep(), RESULT)));
    save();
    render();
    try { window.scrollTo(0, 0); } catch (e) {}
    var h = document.getElementById('h');
    if (h) h.focus({ preventScroll: true });
  }

  function setChrome() {
    var total = RESULT;
    bar.style.width = Math.round(S.step / total * 100) + '%';
    if (S.step === 0) stepcount.textContent = 'Circa 10 minuti';
    else if (S.step <= AREAS.length) stepcount.textContent = 'Area ' + S.step + ' di ' + AREAS.length;
    else if (S.step === LAST) stepcount.textContent = 'Ultime domande';
    else stepcount.textContent = 'Risultato';
  }

  /* ---------- schermate ---------- */
  function renderIntro() {
    app.innerHTML =
      '<h1 id="h" tabindex="-1">Da dove parte la tua impresa</h1>' +
      '<p class="lead">Prima della nostra prima sessione, questo check-up misura a che punto sono otto aree della tua attività: dalla visione ai numeri. Non ci sono risposte giuste. Rispondi per come stanno le cose oggi.</p>' +
      '<div class="field"><label for="f-nome">Nome e cognome</label><input type="text" id="f-nome" autocomplete="name"></div>' +
      '<div class="field"><label for="f-tipo">Cosa stai costruendo</label><select id="f-tipo"><option value="">Scegli…</option>' +
      TIPI.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="f-fase">A che punto sei</label><select id="f-fase"><option value="">Scegli…</option>' +
      FASI.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
      '<div class="nav"><span></span><button class="btn" id="next" type="button">Inizia il check-up</button></div>' +
      '<p class="hint" id="hint"></p>';
    var nome = document.getElementById('f-nome'), tipo = document.getElementById('f-tipo'), fase = document.getElementById('f-fase');
    var next = document.getElementById('next'), hint = document.getElementById('hint');
    nome.value = S.profile.nome; tipo.value = S.profile.tipo; fase.value = S.profile.fase;
    function upd() {
      S.profile.nome = nome.value; S.profile.tipo = tipo.value; S.profile.fase = fase.value;
      save();
      var ok = !!profileOk();
      next.disabled = !ok;
      hint.textContent = ok ? '' : 'Compila i tre campi per iniziare.';
    }
    [nome, tipo, fase].forEach(function (el) { el.addEventListener('input', upd); el.addEventListener('change', upd); });
    next.addEventListener('click', function () { if (profileOk()) go(1); });
    upd();
  }

  function renderArea(i) {
    var A = AREAS[i];
    var html =
      '<p class="kicker">Fase ' + A.fase + ' · ' + esc(PHASES[A.fase - 1].name) + ' · ' + esc(A.sess) + '</p>' +
      '<h1 id="h" tabindex="-1">' + esc(A.name) + '</h1>' +
      '<p class="lead">' + esc(A.lead) + '</p>' +
      '<p class="legend">Quanto è vera ogni frase oggi? 1 = per niente, 5 = del tutto.</p>';
    A.items.forEach(function (txt, k) {
      var id = 'q' + i + '-' + k;
      html += '<fieldset><legend>' + esc(txt) + '</legend><div class="scale">';
      for (var v = 1; v <= 5; v++) {
        html += '<input type="radio" name="' + id + '" id="' + id + '-' + v + '" value="' + v + '" aria-label="' + v + ' su 5">' +
                '<label for="' + id + '-' + v + '">' + v + '</label>';
      }
      html += '</div><div class="ends"><span>Per niente</span><span>Del tutto</span></div></fieldset>';
    });
    html += '<div class="nav"><button class="btn ghost" id="back" type="button">Indietro</button>' +
            '<button class="btn" id="next" type="button">Avanti</button></div><p class="hint" id="hint"></p>';
    app.innerHTML = html;
    [0, 1, 2].forEach(function (k) {
      var cur = S.a[i + '-' + k];
      if (cur) document.getElementById('q' + i + '-' + k + '-' + cur).checked = true;
    });
    var next = document.getElementById('next'), hint = document.getElementById('hint');
    function upd() {
      var ok = areaDone(i);
      next.disabled = !ok;
      hint.textContent = ok ? '' : 'Rispondi a tutte e tre le frasi per continuare.';
    }
    app.querySelectorAll('input[type=radio]').forEach(function (r) {
      r.addEventListener('change', function () {
        var parts = r.name.slice(1).split('-');
        S.a[parts[0] + '-' + parts[1]] = parseInt(r.value, 10);
        save(); upd();
      });
    });
    document.getElementById('back').addEventListener('click', function () { go(S.step - 1); });
    next.addEventListener('click', function () { if (areaDone(i)) go(S.step + 1); });
    upd();
  }

  function renderOpen() {
    app.innerHTML =
      '<p class="kicker">Ultime domande</p>' +
      '<h1 id="h" tabindex="-1">Tre righe su di te</h1>' +
      '<p class="lead">Sono facoltative, ma ci fanno partire dalla prima sessione con il contesto giusto.</p>' +
      '<div class="field"><label for="o-idea">Descrivi in due righe la tua attività o la tua idea <span class="opt">(facoltativo)</span></label><textarea id="o-idea"></textarea></div>' +
      '<div class="field"><label for="o-ost">Qual è oggi l’ostacolo più grande? <span class="opt">(facoltativo)</span></label><textarea id="o-ost"></textarea></div>' +
      '<div class="field"><label for="o-obj">Cosa vuoi aver ottenuto tra tre mesi? <span class="opt">(facoltativo)</span></label><textarea id="o-obj"></textarea></div>' +
      '<div class="nav"><button class="btn ghost" id="back" type="button">Indietro</button><button class="btn" id="next" type="button">Vedi il risultato</button></div>';
    var f = { idea: document.getElementById('o-idea'), ostacolo: document.getElementById('o-ost'), obiettivo: document.getElementById('o-obj') };
    Object.keys(f).forEach(function (k) {
      f[k].value = S.open[k];
      f[k].addEventListener('input', function () { S.open[k] = f[k].value; save(); });
    });
    document.getElementById('back').addEventListener('click', function () { go(S.step - 1); });
    document.getElementById('next').addEventListener('click', function () { go(RESULT); });
  }

  function radar(vals) {
    var cx = 180, cy = 180, R = 108, n = vals.length;
    function pt(i, r) { var a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }
    function fmt(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }
    var s = '<svg viewBox="0 0 360 360" role="img" aria-label="Grafico radar: punteggio percentuale per ciascuna delle otto aree">';
    [0.25, 0.5, 0.75, 1].forEach(function (k) {
      s += '<polygon class="rg" points="' + vals.map(function (_, i) { return fmt(pt(i, R * k)); }).join(' ') + '"/>';
    });
    vals.forEach(function (_, i) { var o = pt(i, R); s += '<line class="rax" x1="' + cx + '" y1="' + cy + '" x2="' + o[0].toFixed(1) + '" y2="' + o[1].toFixed(1) + '"/>'; });
    s += '<polygon class="rpoly" points="' + vals.map(function (v, i) { return fmt(pt(i, R * Math.max(v, 0.02))); }).join(' ') + '"/>';
    vals.forEach(function (v, i) { var p = pt(i, R * Math.max(v, 0.02)); s += '<circle class="rdot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4"/>'; });
    vals.forEach(function (_, i) {
      var p = pt(i, R + 16), a = -Math.PI / 2 + i * 2 * Math.PI / n, c = Math.cos(a), sn = Math.sin(a);
      var anchor = c > 0.3 ? 'start' : (c < -0.3 ? 'end' : 'middle');
      var dy = sn > 0.3 ? '0.8em' : (sn < -0.3 ? '-0.1em' : '0.35em');
      s += '<text class="rlab" x="' + p[0].toFixed(1) + '" y="' + p[1].toFixed(1) + '" dy="' + dy + '" text-anchor="' + anchor + '">' + esc(AREAS[i].short) + '</text>';
    });
    return s + '</svg>';
  }

  function summaryText(rows, overall, lowest) {
    var L = [];
    L.push('CHECK-UP IMPRESA 360');
    L.push('Data: ' + new Date().toLocaleDateString('it-IT'));
    L.push('Nome: ' + S.profile.nome.trim());
    L.push('Attività: ' + S.profile.tipo);
    L.push('Fase: ' + S.profile.fase);
    L.push('Punteggio complessivo: ' + overall + '% (' + overallLabel(overall) + ')');
    L.push('');
    L.push('Punteggio per area:');
    rows.forEach(function (r, i) { L.push((i + 1) + '. ' + AREAS[i].name + ': ' + r.pct + '% (' + level(r.pct).t + ')'); });
    L.push('');
    L.push('Aree da cui partire: ' + lowest.map(function (r) { return AREAS[r.i].name + ' (' + AREAS[r.i].sess.toLowerCase() + ')'; }).join('; '));
    L.push('');
    L.push('La mia attività o idea: ' + (S.open.idea.trim() || '-'));
    L.push('Ostacolo più grande oggi: ' + (S.open.ostacolo.trim() || '-'));
    L.push('Obiettivo tra tre mesi: ' + (S.open.obiettivo.trim() || '-'));
    return L.join('\n');
  }

  function renderResult() {
    var rows = AREAS.map(function (A, i) { return { i: i, pct: areaPct(i) }; });
    var overall = Math.round(rows.reduce(function (t, r) { return t + r.pct; }, 0) / rows.length);
    var lowest = rows.slice().sort(function (a, b) { return a.pct - b.pct || a.i - b.i; }).slice(0, 2);
    var lv = level(overall);
    var html =
      '<p class="kicker">Il tuo punto di partenza</p>' +
      '<h1 id="h" tabindex="-1"></h1>' +
      '<div class="score"><div class="num">' + overall + '%</div><div><span class="pill ' + lv.c + '">' + esc(overallLabel(overall)) + '</span>' +
      '<div class="ss" style="font-size:14px;color:var(--muted);margin-top:4px">Media delle otto aree</div></div></div>' +
      '<div class="radar">' + radar(rows.map(function (r) { return r.pct / 100; })) + '</div>' +
      '<p class="caption">Il bordo esterno corrisponde al 100%.</p>';
    PHASES.forEach(function (ph, pi) {
      html += '<div class="phase-head">Fase ' + (pi + 1) + ' · ' + esc(ph.name) + '</div>';
      rows.filter(function (r) { return AREAS[r.i].fase === pi + 1; }).forEach(function (r) {
        var A = AREAS[r.i], l = level(r.pct);
        html += '<div class="arow"><div class="l1"><div><div class="nm">' + esc(A.name) + '</div><div class="ss">' + esc(A.sess) + '</div></div>' +
                '<div class="r"><span class="pill ' + l.c + '">' + l.t + '</span><span class="pc">' + r.pct + '%</span></div></div>' +
                '<div class="track"><div style="width:' + r.pct + '%"></div></div></div>';
      });
    });
    html += '<section class="start"><h2>Da dove conviene partire</h2><ul>' +
      lowest.map(function (r) {
        var A = AREAS[r.i];
        return '<li><strong>' + esc(A.name) + '</strong> (' + esc(A.sess.toLowerCase()) + '). Documento che costruiremo: ' + esc(A.doc) + '.</li>';
      }).join('') +
      '</ul><p>Ne parliamo nella prima sessione per decidere insieme l’ordine di lavoro.</p></section>' +
      '<section class="send"><h2>Invia i risultati a Emanuela</h2>' +
      '<p class="lead" style="margin-bottom:12px">Premi il pulsante per inviare il tuo riepilogo a Emanuela Caiano prima della prima sessione. Verranno inviati solo nome, risposte e punteggi che vedi qui sotto.</p>' +
      '<textarea id="sum" readonly aria-label="Riepilogo del check-up"></textarea>' +
      '<div class="row"><button class="btn" id="sendbtn" type="button">Invia a Emanuela</button><button class="btn ghost" id="copy" type="button">Copia il riepilogo</button></div>' +
      '<p class="status" id="status" role="status" style="margin-top:10px"></p></section>' +
      '<div class="nav reset"><button class="btn ghost" id="back" type="button">Modifica le risposte</button><button class="btn ghost" id="reset" type="button">Ricomincia da capo</button></div>' +
      '<p class="hint" id="hint"></p>';
    app.innerHTML = html;
    document.getElementById('h').textContent = S.profile.nome.trim();
    var ta = document.getElementById('sum'), status = document.getElementById('status');
    ta.value = summaryText(rows, overall, lowest);
    var sendbtn = document.getElementById('sendbtn');
    if (S.sent) { sendbtn.textContent = 'Inviato. Reinvia'; status.textContent = 'Riepilogo già inviato a Emanuela.'; }
    sendbtn.addEventListener('click', function () {
      sendbtn.disabled = true; status.textContent = 'Invio in corso…';
      fetch(SEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({
          _subject: 'Check-up IMPRESA 360 · ' + S.profile.nome.trim(),
          _template: 'box', _captcha: 'false',
          Nome: S.profile.nome.trim(), Attività: S.profile.tipo, Fase: S.profile.fase,
          'Punteggio complessivo': overall + '%',
          Riepilogo: ta.value
        })
      }).then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.success === 'false' || j.success === false) throw new Error('send'); }); })
        .then(function () { S.sent = true; save(); sendbtn.textContent = 'Inviato. Reinvia'; sendbtn.disabled = false; status.textContent = 'Fatto: il riepilogo è stato inviato a Emanuela. Grazie!'; })
        .catch(function () {
          sendbtn.disabled = false;
          status.innerHTML = 'Invio non riuscito. Copia il riepilogo e inviarlo a <a href="mailto:' + MAIL + '?subject=' + encodeURIComponent('Check-up IMPRESA 360 · ' + S.profile.nome.trim()) + '">' + MAIL + '</a>.';
        });
    });
    document.getElementById('copy').addEventListener('click', function () {
      var done = false;
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ta.value).then(function () { status.textContent = 'Riepilogo copiato.'; }, fallback);
          done = true;
        }
      } catch (e) {}
      if (!done) fallback();
      function fallback() { ta.focus(); ta.select(); status.textContent = 'Testo selezionato: copialo con Ctrl+C o Cmd+C.'; }
    });
    document.getElementById('back').addEventListener('click', function () { S.step = LAST; save(); render(); try { window.scrollTo(0, 0); } catch (e) {} });
    var armed = false, reset = document.getElementById('reset'), hint = document.getElementById('hint');
    reset.addEventListener('click', function () {
      if (!armed) { armed = true; reset.textContent = 'Conferma: cancella tutte le risposte'; hint.textContent = 'Le risposte e il riepilogo verranno cancellati.'; return; }
      S = { step: 0, profile: { nome: '', tipo: '', fase: '' }, a: {}, open: { idea: '', ostacolo: '', obiettivo: '' }, sent: false };
      save(); render(); try { window.scrollTo(0, 0); } catch (e) {}
    });
  }

  function render() {
    var m = maxStep();
    if (S.step > m && !(m === RESULT)) S.step = m;
    if (S.step > RESULT) S.step = RESULT;
    if (S.step < 0) S.step = 0;
    setChrome();
    if (S.step === 0) renderIntro();
    else if (S.step <= AREAS.length) renderArea(S.step - 1);
    else if (S.step === LAST) renderOpen();
    else renderResult();
  }

  render();
})();
</script>
</body>
</html>
